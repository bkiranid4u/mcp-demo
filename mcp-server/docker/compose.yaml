services:
  # --- The Database Service ---
  groot-db:
    # The blueprint: Uses the official Postgres image from Docker Hub
    image: postgres:latest
    # Fixed name for easier CLI commands (e.g., 'docker logs postgres_db')
    container_name: postgres_db
    # Policy: Restarts automatically on crash or host reboot, but stays off if manually stopped
    restart: unless-stopped
    
    # Environment variables: Defines the DB credentials and internal data path
    environment:
      POSTGRES_USER: ${POSTGRES_USER}       
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # PGDATA ensures the DB files are stored in a sub-folder to avoid root-level lock issues
      PGDATA: ${PGDATA}/pgdata
    
    # Port mapping: HostPort:ContainerPort. Allows your Mac to connect via localhost:5432
    ports:
      - "5432:5432"
    
    # Persistence: Maps the named volume to the container's data directory
    volumes:
      - postgres_data:${PGDATA}
    
    # Resource Governance: Prevents the DB from consuming all host RAM/CPU
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Hard ceiling: 50% of 1 CPU core
          memory: 512M     # Hard ceiling: RAM limit to prevent system slowdown
    
    # The Heartbeat: Verified that the DB engine is actually ready for queries
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groot -d groot_db"]
      interval: 10s       # Check every 10 seconds
      timeout: 5s        # Give up on the check after 5 seconds
      retries: 5         # Mark as 'unhealthy' after 5 consecutive failures
      start_period: 20s   # Grace period: Wait 20s before starting the first check
    
    # Isolation: Places the DB in a dedicated network bridge
    networks:
      - mcp_network

  # --- The Management UI ---
  pgadmin:
    # Official Web-based GUI for Postgres
    image: dpage/pgadmin4
    container_name: pgadmin_container
    restart: unless-stopped
    
    # Order of Operations: Ensures pgAdmin waits for the DB to pass its Healthcheck
    depends_on:
      groot-db:
        condition: service_healthy
    
    # pgAdmin credentials for the web login (http://localhost:5050)
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@groot.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80 # Forces the container to listen on standard port 80
    
    # Access: Maps local port 5050 to the container's web server
    ports:
      - "5050:80"
    
    # Persistence: Saves your 'Saved Servers' and GUI preferences
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    
    # Resource Governance: pgAdmin is lightweight, so we give it a smaller slice
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    
    # Connectivity: Must be on the same network as 'db' to find it by name
    networks:
      - mcp_network

# --- Infrastructure Definitions ---

# Named Volumes: Docker-managed storage (Persists even if containers are deleted)
volumes:
  postgres_data:
  pgadmin_data:

# Internal Bridge Network: Allows services to communicate via service name (e.g., 'db')
networks:
  mcp_network:
    driver: bridge